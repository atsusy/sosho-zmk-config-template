CONFIG_ZMK_KEYBOARD_NAME="sosho"

# BLE有効化
# 接続パラメータはコメントアウト中（デフォルト値を使用）
CONFIG_ZMK_BLE=y
#CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
#CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
#CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
#CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ZMK Studio（キーマップのリアルタイム編集）
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ロータリーエンコーダ有効化
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ポインティングデバイス（トラックパッド）有効化
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_INIT_PRIORITY=99
# センサー: Cirque Glidepoint
CONFIG_INPUT_PINNACLE=y

# エンコーダ・ポインティングイベントのキューサイズ
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=128

# nRF52840のNFCピンをGPIOとして使用
CONFIG_NFCT_PINS_AS_GPIOS=y

# LED（バッテリー残量表示）
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# バッテリー管理・スリープ
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_BT_BAS=y

# スプリット: Central側としてPeripheral(L)のバッテリー残量を取得・中継
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#CONFIG_ZMK_USB_LOGGING=y

# スタックサイズ（ポインティングデバイス使用時に増量）
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=3072

# BLE接続安定化（macOS対策）
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ハング時自動リセット
CONFIG_WATCHDOG=y
