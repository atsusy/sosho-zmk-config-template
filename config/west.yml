manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: abababababababa
      url-base: https://github.com/abababababababa
  projects:
    - name: zmk
      remote: zmkfirmware
      # 再現性のためZMK本体もリビジョン固定（左右でビルド時期がずれると不整合→BLEチャーンの原因に）
      revision: 64daf698e073e37b6748ac54f4eb48d8666af0b9
      import: app/west.yml
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
    - name: zmk-pmw3610-driver
