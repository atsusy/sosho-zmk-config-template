manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: atsusy
      url-base: https://github.com/atsusy
  projects:
    - name: zmk
      remote: zmkfirmware
      # 再現性のためZMK本体もリビジョン固定（左右でビルド時期がずれると不整合→BLEチャーンの原因に）
      revision: 64daf698e073e37b6748ac54f4eb48d8666af0b9
      import: app/west.yml
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
    - name: zmk-pmw3610-driver
      remote: atsusy
      # kumamukドライバ(roBa方式の離散スクロール)を fork し、compatibleを pixart,pmw3610-kuma に
      # リネームした版（Zephyr4.1のビルトインbinding衝突回避）。再現性のため固定
      revision: db8dd77a33c2cdc5ce4c5e13451424410d23863b
  self:
    path: config