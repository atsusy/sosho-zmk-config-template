manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: kumamuk-git
      url-base: https://github.com/kumamuk-git
  projects:
    - name: zmk
      remote: zmkfirmware
      # 再現性のためZMK本体もリビジョン固定（左右でビルド時期がずれると不整合→BLEチャーンの原因に）
      revision: 64daf698e073e37b6748ac54f4eb48d8666af0b9
      import: app/west.yml
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
    - name: zmk-pmw3610-driver
      remote: kumamuk-git
      # roBaと同じkumamuk版ドライバ（ドライバ内蔵の離散スクロール）。再現性のため固定
      revision: 5e04553ab803d24405bd45621a41310ea3050e59
  self:
    path: config