CONFIG_ZMK_KEYBOARD_NAME="sosho"

#BLE connect
CONFIG_ZMK_BLE=y
#CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
#CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
#CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
#CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

#ZMK STUDIO（負荷削減の検証のため有効化に戻した）
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#enable mouse
CONFIG_ZMK_MOUSE=y

#SPI
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_INIT_PRIORITY=99
#PMW3610 (kumamuk driver: roBaと同じドライバ内蔵の離散スクロール。Chrome入れ子コンテナ対策)
CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=400
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_SMART_ALGORITHM=y
# 向き・反転は要調整（焼いてポインタ/スクロール方向を見て 0/90/180/270, INVERT_* を選ぶ）
CONFIG_PMW3610_ORIENTATION_90=y

#encoder sensitive
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

#use NFC pins
CONFIG_NFCT_PINS_AS_GPIOS=y

#RGBLED_WIDGET
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

#BATTERY
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_BT_BAS=y

#SPLIT
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_USB_LOGGING=n