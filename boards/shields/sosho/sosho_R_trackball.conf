CONFIG_ZMK_KEYBOARD_NAME="sosho"

#BLE connect
CONFIG_ZMK_BLE=y
#CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
#CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# LATENCYは必ず0で明示する。コメントアウトするとZMK既定の30が効き(app/Kconfig)、
# 接続間隔7.5-15ms x 30 = 最大225-450msホスト側へ無音になる。キーボードなら省電力だが
# トラックボールでは「止まる→まとめて出る(ワープ)」に直結する。upstream verB2も0。
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

#ZMK STUDIO（負荷削減の検証のため有効化に戻した）
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#enable mouse
CONFIG_ZMK_MOUSE=y

#SPI
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_INIT_PRIORITY=99
# hi-res(SMOOTH_SCROLLING)は無効に戻す。DevTools比較で、hi-res有効だとmacOSが精密スクロール扱い
# にしてChromeの入れ子コンテナ連鎖バグを踏む（=Jira/Chatworkで動かない）と判明。Keyball(QMK)は
# hi-res無しの素のホイールで動くので、それに合わせて素のホイール+適正分周(overlay 1/8)で出す。
#CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
#PMW3610 (badjeff ALT driver: レポートレート間引きで洪水→フリーズを防止)
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# PMW3610 省電力(REST)モード対策 ── 「動きが止まる/ワープする」の本命
# ドライバ既定は RUN_DOWNSHIFT=128ms / REST1_SAMPLE=40ms。つまり0.128秒手を止めただけで
# REST1に落ち、以後40ms間隔でしかサンプリングしない。結果:
#   ・動かし始めの数十〜数百msが検出されない  = 止まる
#   ・復帰時の最初のバーストに溜まった分が乗る = ワープ
# USB/BLEどちらでも起こる(=接続方式に依存しない)。roBa公式configも同じ理由で
# RUN_DOWNSHIFTを最大値まで伸ばし、REST1を速めている。それに合わせる。
# 値域: RUN_DOWNSHIFTはKconfigのrangeが 13-3264、REST1_SAMPLEは 10-2550。
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20

# ↓それでも残る場合の次の手（電池消費は増えるので、上記で駄目だった時だけ）
#   1) sosho.dtsi の trackball ノードに force-awake; を追加 → 常にRUNモード
#   2) USB主体なら間引きを緩める（Kconfigのhelpに「USB onlyなら8ms」と明記）
#      CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=8

#encoder sensitive
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

#use NFC pins
CONFIG_NFCT_PINS_AS_GPIOS=y

#RGBLED_WIDGET
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

#BATTERY
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_BT_BAS=y

#SPLIT
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_USB_LOGGING=n