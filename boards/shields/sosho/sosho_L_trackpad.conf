CONFIG_ZMK_KEYBOARD_NAME="sosho"

#BLE connect
CONFIG_ZMK_BLE=y

#enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#enable mouse
CONFIG_ZMK_MOUSE=y

#SPI
# ZMK_POINTING は upstream と同じく有効のまま残す。左にポインティングデバイスが
# 無いので実質未使用だが、Kconfig.defconfig が default y にしており、
# あえて外しても得るものがない。
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_INIT_PRIORITY=99
#Glidepoint
# この個体にはトラックパッドが載っていないため無効化。
# 有効のままだと pinnacle_init() が Firmware ASIC ID チェックで -ENODEV を返し、
# 初期化に失敗したデバイスが残るだけで一切利点がない。
#CONFIG_INPUT_PINNACLE=y

#encoder sensitive
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

#use NFC pins
CONFIG_NFCT_PINS_AS_GPIOS=y

#RGBLED_WIDGET
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

#フリーズ対策（upstream elekit/verB2 と同じ値に戻した）
# ここは左右リンク(L→R)のパラメータであってホスト接続とは無関係。
# この個体の左側はキーとエンコーダしか無いので、7.5-15ms/latency 0 で回す利点がゼロな一方、
# 左右リンクの無線占有率だけが倍になり、R↔ホスト間（ATTプールが枯渇する側）から
# 無線時間を奪ってしまう。
# なお peripheral latency は「送るものが無い時に接続イベントを飛ばしてよい回数」なので、
# 10 にしてもキーを押した時の反応は一切遅くならない。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=10
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=20
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

#BATTERY
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_BT_BAS=y

#SPLIT
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ウォッチドッグ（src/watchdog.c）。詳細は sosho_R_trackball.conf のコメント参照。
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
